<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>offline-todo</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#1e2329; --mute:#8b93a1;
    --line:#e6e8ec; --accent:#4f7cf7; --red:#e5484d; --orange:#f08c1e; --green:#2fa36b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.6 "Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",system-ui,sans-serif;
    padding:28px 16px 60px;
  }
  .wrap{max-width:720px;margin:0 auto;}

  .head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .head h1{font-size:24px;margin:0;letter-spacing:.5px;}
  .head .sub{color:var(--mute);font-size:13px;text-align:right;}

  .alert{
    background:#fff5f5;border:1px solid #ffd8d8;border-left:3px solid var(--red);
    border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13.5px;
  }
  .alert .lead{font-weight:600;color:var(--red);margin-bottom:2px;}
  .alert .item{color:#5c4040;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .add{
    display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:10px;box-shadow:0 1px 2px rgba(20,30,50,.04);
  }
  .add input[type=text]{flex:1;min-width:0;border:0;outline:0;font:inherit;background:transparent;padding:6px 8px;color:var(--ink);}
  .add input[type=text]::placeholder{color:#b3b9c4;}
  .add input[type=date], .add input[type=time]{
    border:1px solid var(--line);border-radius:8px;padding:4px 6px;font:inherit;
    color:var(--mute);background:#fbfbfc;font-size:13px;flex:0 0 auto;
  }
  .add input[type=time]{width:88px;}
  .add button{
    border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;
    padding:6px 16px;cursor:pointer;flex:0 0 auto;
  }
  .add button:hover{filter:brightness(1.06);}

  ul{list-style:none;padding:0;margin:16px 0 0;}
  li.row{
    display:flex;align-items:flex-start;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;
    box-shadow:0 1px 2px rgba(20,30,50,.03);
  }
  li.row.done{opacity:.55;}
  li.row.tight{border-left:3px solid var(--orange);}
  li.row.over{border-left:3px solid var(--red);}

  .box{
    width:18px;height:18px;flex:0 0 18px;margin-top:3px;border-radius:6px;
    border:1.5px solid #c8cdd6;cursor:pointer;display:flex;align-items:center;
    justify-content:center;font-size:12px;color:transparent;user-select:none;
  }
  .box:hover{border-color:var(--accent);}
  li.row.done .box{background:var(--green);border-color:var(--green);color:#fff;}

  .body{flex:1;min-width:0;}
  .title{word-break:break-word;}
  li.row.done .title{text-decoration:line-through;}
  .meta{font-size:12px;color:var(--mute);margin-top:2px;}
  .meta b{font-weight:600;}
  .meta.over b{color:var(--red);}
  .meta.tight b{color:var(--orange);}

  .del{border:0;background:transparent;color:#c3c8d1;font-size:16px;cursor:pointer;padding:0 2px;line-height:1;flex:0 0 auto;}
  .del:hover{color:var(--red);}

  .bell{
    border:0;background:transparent;color:#b9c0cc;font-size:13px;cursor:pointer;
    padding:2px 6px;border-radius:8px;flex:0 0 auto;line-height:1.3;white-space:nowrap;
  }
  .bell:hover{background:#eef1f6;color:var(--accent);}
  .bell.on{color:var(--accent);}
  .bell span{font-size:11px;margin-left:2px;}

  .menu{
    position:fixed;z-index:50;background:#fff;border:1px solid var(--line);
    border-radius:10px;box-shadow:0 10px 28px rgba(20,30,50,.16);padding:6px;min-width:158px;
    max-height:66vh;overflow:auto;
  }
  .menu div{padding:6px 10px;border-radius:7px;cursor:pointer;font-size:13px;}
  .menu div:hover{background:#f1f4fa;}
  .menu div.cur{color:var(--accent);font-weight:600;}
  .menu div i.ck{display:inline-block;width:15px;font-style:normal;color:var(--accent);}
  .menu .sep{height:1px;background:var(--line);margin:5px 4px;padding:0;pointer-events:none;}

  .cfg{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px 12px;}
  .cfg .line{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px;flex-wrap:wrap;}
  .cfg .line label{color:#4a5260;flex:0 0 auto;}
  .cfg select{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:#fbfbfc;color:var(--ink);}
  .cfg .hint{color:var(--mute);font-size:12px;}

  .empty{color:var(--mute);text-align:center;padding:34px 0;font-size:14px;}

  details{margin-top:22px;}
  summary{cursor:pointer;color:var(--mute);font-size:13px;outline:none;list-style:none;}
  summary::-webkit-details-marker{display:none;}
  summary::before{content:"▸ ";}
  details[open] summary::before{content:"▾ ";}

  .foot{margin-top:34px;text-align:center;}
  .quit{color:#b3b9c4;font-size:12px;cursor:pointer;border-bottom:1px dashed #d3d8e0;padding-bottom:1px;user-select:none;}
  .quit:hover{color:var(--red);border-color:var(--red);}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>offline-todo</h1>
    <div class="sub" id="sub"></div>
  </div>

  <div class="alert" id="alert" style="display:none">
    <div class="lead" id="alertLead"></div>
    <div id="alertItems"></div>
  </div>

  <div class="add">
    <input type="text" id="title" placeholder="要做什么？回车就加" autocomplete="off">
    <input type="date" id="due" title="截止日期（可以不填）">
    <input type="time" id="dueTime" title="具体时间（不填按当天 23:59 算）">
    <button id="addBtn">加</button>
  </div>

  <details class="cfg" id="cfgBox">
    <summary>提醒设置</summary>
    <div class="line">
      <label>默认提前</label>
      <select id="cfgDefault"></select>
      <span class="hint">单条可以在右边铃铛里单独改</span>
    </div>
    <div class="line">
      <label>没做完的话，隔多久再催</label>
      <select id="cfgRepeat"></select>
    </div>
    <div class="line">
      <label>同一条最多催几次</label>
      <select id="cfgMax"></select>
    </div>
    <div class="line">
      <label><input type="checkbox" id="cfgEnabled"> 开启桌面提醒</label>
      <span class="hint">关掉之后桌面卡片不再弹提醒，网页版照常显示</span>
    </div>
  </details>

  <ul id="list"></ul>
  <div class="empty" id="empty" style="display:none">空着。挺好。</div>

  <details id="doneBox" style="display:none">
    <summary>已完成 <span id="doneCount"></span></summary>
    <ul id="doneList"></ul>
  </details>

  <div class="foot">
    <span id="quit" class="quit">关掉 offline-todo</span>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);

async function api(path, data) {
  const r = await fetch(path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data || {})
  });
  return r.json();
}

// ---- 时间：due 可以是 '2026-11-25'（当天 23:59）或 '2026-11-25 14:00'
function parseDue(due) {
  if (!due) return null;
  const s = String(due).trim().replace('T', ' ');
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:\s+(\d{1,2}):(\d{2}))?$/);
  if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3],
                     m[4] ? +m[4] : 23, m[5] ? +m[5] : 59, 0, 0);
  return isNaN(d.getTime()) ? null : d;
}

function leftMinutes(due) {
  const d = parseDue(due);
  if (!d) return null;
  return (d - Date.now()) / 60000;
}

function fmtLeft(mins) {
  let m = Math.round(Math.abs(mins));
  let body;
  if (m >= 1440) body = Math.floor(m / 1440) + ' 天';
  else if (m >= 60) body = Math.floor(m / 60) + ' 小时' + (m % 60 ? ' ' + (m % 60) + ' 分' : '');
  else body = m + ' 分钟';
  return (mins < 0 ? '已过 ' : '还有 ') + body;
}

function dueText(due) {
  const m = leftMinutes(due);
  return m === null ? '' : fmtLeft(m);
}

const REMIND_OPTS = [
  [15, '提前 15 分钟'], [30, '提前 30 分钟'], [60, '提前 1 小时'],
  [120, '提前 2 小时'], [180, '提前 3 小时'], [360, '提前 6 小时'],
  [720, '提前半天'], [1440, '提前 1 天'], [2880, '提前 2 天'],
];

function remindLabel(v) {
  if (v === null || v === undefined || v === '') return '默认';
  if (Number(v) === 0) return '不提醒';
  const hit = REMIND_OPTS.find(o => o[0] === Number(v));
  return hit ? hit[1].replace('提前 ', '') : Number(v) + ' 分钟';
}

// 这一条设了几个提前量：null = 用全局默认，[] = 不提醒，其余是分钟列表
function itemTimes(it) {
  const raw = it.remind_list;
  if (raw === undefined || raw === null) {
    const b = it.remind_before;
    if (b === undefined || b === null || b === '') return null;
    return [Number(b)];
  }
  return (raw || []).map(Number).filter(v => v > 0);
}

function remindText(it) {
  const t = itemTimes(it);
  if (t === null) return '默认';
  if (!t.length) return '不提醒';
  if (t.length === 1) return remindLabel(t[0]);
  return t.length + ' 个提醒';
}

// ---- 小菜单（单条的提前量，可以勾好几个）
let openMenuEl = null;
let menuDirty = false;

function closeMenu(reload) {
  if (openMenuEl) { openMenuEl.remove(); openMenuEl = null; }
  if (reload) load();
}

document.addEventListener('click', () => {
  if (openMenuEl) closeMenu(menuDirty);
});

function showRemindMenu(anchor, it, onBadge) {
  closeMenu(false);
  menuDirty = false;
  const cur = (itemTimes(it) || []).slice();

  const el = document.createElement('div');
  el.className = 'menu';

  const save = (list, extra) => {
    menuDirty = true;
    const body = Object.assign({id: it.id}, extra || {});
    if (!extra || !('no_repeat' in extra)) body.minutes = list;
    return api('/api/remind', body).catch(() => {});
  };

  const mark = (row, on, text) => {
    row.className = on ? 'cur' : '';
    row.innerHTML = '';
    const ck = document.createElement('i');
    ck.className = 'ck';
    ck.textContent = on ? '✓' : '';
    row.appendChild(ck);
    row.appendChild(document.createTextNode(text));
  };

  REMIND_OPTS.forEach(([v, text]) => {
    const row = document.createElement('div');
    mark(row, cur.includes(v), text);
    row.onclick = e => {
      e.stopPropagation();
      const i = cur.indexOf(v);
      if (i >= 0) cur.splice(i, 1); else cur.push(v);
      mark(row, cur.includes(v), text);
      save(cur.slice());
      onBadge(cur.length === 0 ? '不提醒'
        : cur.length === 1 ? remindLabel(cur[0]) : cur.length + ' 个提醒');
    };
    el.appendChild(row);
  });

  const custom = document.createElement('div');
  mark(custom, false, '自定义…（分钟，逗号分隔）');
  custom.onclick = e => {
    e.stopPropagation();
    const s = prompt('提前多少分钟？可以用逗号分开，比如 90,1440（1440 = 1 天）', cur.join(','));
    if (s === null) return;
    const vals = s.split(/[,，\s]+/).map(Number).filter(x => x > 0);
    cur.length = 0; cur.push(...vals);
    save(cur.slice()).then(() => closeMenu(true));
    onBadge(cur.length === 0 ? '不提醒'
      : cur.length === 1 ? remindLabel(cur[0]) : cur.length + ' 个提醒');
  };
  el.appendChild(custom);

  const sep = document.createElement('div');
  sep.className = 'sep';
  el.appendChild(sep);

  const dflt = document.createElement('div');
  mark(dflt, false, '用全局默认');
  dflt.onclick = e => {
    e.stopPropagation();
    it.remind_list = null;
    save(null).then(() => closeMenu(true));
    onBadge('默认');
  };
  el.appendChild(dflt);

  const none = document.createElement('div');
  mark(none, false, '这条不提醒');
  none.onclick = e => {
    e.stopPropagation();
    cur.length = 0;
    save([]).then(() => closeMenu(true));
    onBadge('不提醒');
  };
  el.appendChild(none);

  const sep2 = document.createElement('div');
  sep2.className = 'sep';
  el.appendChild(sep2);

  const nr = document.createElement('div');
  mark(nr, !!it.no_repeat, '到点之后别再催我');
  nr.onclick = e => {
    e.stopPropagation();
    it.no_repeat = !it.no_repeat;
    mark(nr, !!it.no_repeat, '到点之后别再催我');
    save(cur.slice(), {no_repeat: !!it.no_repeat});
  };
  el.appendChild(nr);

  document.body.appendChild(el);
  const r = anchor.getBoundingClientRect();
  const top = Math.min(window.innerHeight - el.offsetHeight - 8, r.bottom + 6);
  const left = Math.min(window.innerWidth - el.offsetWidth - 8, r.left - el.offsetWidth + r.width);
  el.style.top = Math.max(8, top) + 'px';
  el.style.left = Math.max(8, left) + 'px';
  openMenuEl = el;
}

function row(it) {
  const m = leftMinutes(it.due);
  const li = document.createElement('li');
  li.className = 'row' +
    (it.done ? ' done' : '') +
    (!it.done && m !== null && m < 0 ? ' over' : '') +
    (!it.done && m !== null && m >= 0 && m <= 1440 ? ' tight' : '');

  const box = document.createElement('div');
  box.className = 'box';
  box.textContent = '✓';
  box.title = it.done ? '撤销' : '做完了';
  box.onclick = () => api('/api/toggle', {id: it.id}).then(load);

  const body = document.createElement('div');
  body.className = 'body';
  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = it.title;
  title.title = '双击修改';
  title.ondblclick = () => {
    const t = prompt('改成什么？', it.title);
    if (t === null) return;
    const dd = prompt('截止日期（YYYY-MM-DD，留空表示没有）', (it.due || '').slice(0, 10));
    if (dd === null) return;
    const tt = prompt('几点？（HH:MM，留空按 23:59）',
      (it.due || '').length > 10 ? it.due.slice(11) : '');
    if (tt === null) return;
    const due = dd.trim() ? (dd.trim() + (tt.trim() ? ' ' + tt.trim() : '')) : '';
    api('/api/edit', {id: it.id, title: t, due}).then(load);
  };
  body.appendChild(title);

  if (it.due) {
    const meta = document.createElement('div');
    meta.className = 'meta' + (m < 0 ? ' over' : (m <= 1440 ? ' tight' : ''));
    meta.innerHTML = '<b></b> · <span></span>';
    meta.querySelector('b').textContent = dueText(it.due);
    meta.querySelector('span').textContent = it.due;
    body.appendChild(meta);
  }

  const bell = document.createElement('button');
  const t0 = itemTimes(it);
  bell.className = 'bell' + (t0 !== null ? ' on' : '');
  bell.textContent = '🔔';
  const badge = document.createElement('span');
  badge.textContent = remindText(it);
  bell.appendChild(badge);
  bell.title = '提前多久提醒（点一下，可以勾好几个）';
  bell.onclick = e => {
    e.stopPropagation();
    showRemindMenu(bell, it, txt => {
      badge.textContent = txt;
      bell.className = 'bell' + (itemTimes(it) !== null ? ' on' : '');
    });
  };

  const del = document.createElement('button');
  del.className = 'del';
  del.textContent = '×';
  del.title = '删掉';
  del.onclick = () => {
    if (confirm('删掉「' + it.title + '」？')) api('/api/delete', {id: it.id}).then(load);
  };

  li.append(box, body, bell, del);
  return li;
}

async function load() {
  const r = await fetch('/api/list');
  const {items, today, settings} = await r.json();

  const open = items.filter(i => !i.done);
  const done = items.filter(i => i.done);

  // 有 DDL 的按时间先后，没有的沉底；同一时刻按添加顺序
  const key = i => { const d = parseDue(i.due); return d ? d.getTime() : 8.64e15; };
  open.sort((a, b) => key(a) - key(b) || a.id - b.id);
  done.sort((a, b) => b.id - a.id);

  const list = $('#list');
  list.innerHTML = '';
  open.forEach(i => list.appendChild(row(i)));

  const empty = $('#empty');
  empty.style.display = open.length ? 'none' : 'block';
  empty.textContent = done.length ? '手头的事都做完了。' : '空着。挺好。';

  const doneBox = $('#doneBox');
  doneBox.style.display = done.length ? 'block' : 'none';
  $('#doneCount').textContent = done.length ? '(' + done.length + ')' : '';
  const dl = $('#doneList');
  dl.innerHTML = '';
  done.forEach(i => dl.appendChild(row(i)));

  // 顶部提醒条：过期 + 一天内到期
  const mins = i => leftMinutes(i.due);
  const over = open.filter(i => { const m = mins(i); return m !== null && m < 0; });
  const soon = open.filter(i => { const m = mins(i); return m !== null && m >= 0 && m <= 1440; });
  const alertBox = $('#alert');
  if (over.length || soon.length) {
    const lead = [];
    if (over.length) lead.push(`过期 ${over.length} 件`);
    if (soon.length) lead.push(`一天内到期 ${soon.length} 件`);
    $('#alertLead').textContent = lead.join(' · ');
    const box = $('#alertItems');
    box.innerHTML = '';
    over.concat(soon).slice(0, 4).forEach(i => {
      const d = document.createElement('div');
      d.className = 'item';
      d.textContent = dueText(i.due) + '  ' + i.title;
      box.appendChild(d);
    });
    alertBox.style.display = 'block';
  } else {
    alertBox.style.display = 'none';
  }

  fillSettings(settings || {});

  $('#sub').textContent = today.replace(/-/g, '/') + ` · 待办 ${open.length} 件`;
  document.title = open.length ? `(${open.length}) offline-todo` : 'offline-todo';
}

// ---- 设置面板
function opt(sel, value, text) {
  const o = document.createElement('option');
  o.value = value;
  o.textContent = text;
  sel.appendChild(o);
}

function ensureOpt(sel, v, text) {
  if (![...sel.options].some(o => o.value === String(v))) opt(sel, String(v), text);
}

function fillSettings(s) {
  const d = $('#cfgDefault');
  if (!d.options.length) {
    REMIND_OPTS.forEach(([v, t]) => opt(d, String(v), t));
    const rp = $('#cfgRepeat');
    [[10, '10 分钟'], [30, '30 分钟'], [60, '1 小时'], [120, '2 小时']]
      .forEach(([v, t]) => opt(rp, String(v), t));
    const mx = $('#cfgMax');
    [[1, '1 次'], [2, '2 次'], [3, '3 次'], [5, '5 次']]
      .forEach(([v, t]) => opt(mx, String(v), t));
  }
  // 手改过 settings.json、或者用了下拉里没有的值，也照样能显示出来
  if (s.default_minutes !== undefined) {
    ensureOpt(d, s.default_minutes, '提前 ' + remindLabel(s.default_minutes));
    d.value = String(s.default_minutes);
  }
  if (s.repeat_minutes !== undefined) {
    ensureOpt($('#cfgRepeat'), s.repeat_minutes, s.repeat_minutes + ' 分钟');
    $('#cfgRepeat').value = String(s.repeat_minutes);
  }
  if (s.max_repeats !== undefined) {
    ensureOpt($('#cfgMax'), s.max_repeats, s.max_repeats + ' 次');
    $('#cfgMax').value = String(s.max_repeats);
  }
  if (s.enabled !== undefined) $('#cfgEnabled').checked = !!s.enabled;
}

$('#cfgDefault').onchange = e => api('/api/settings', {default_minutes: +e.target.value}).then(load);
$('#cfgRepeat').onchange = e => api('/api/settings', {repeat_minutes: +e.target.value}).then(load);
$('#cfgMax').onchange = e => api('/api/settings', {max_repeats: +e.target.value}).then(load);
$('#cfgEnabled').onchange = e => api('/api/settings', {enabled: e.target.checked}).then(load);

async function add() {
  const t = $('#title').value.trim();
  if (!t) { $('#title').focus(); return; }
  const day = $('#due').value.trim();
  const hm = $('#dueTime').value.trim();
  const due = day ? (day + (hm ? ' ' + hm : '')) : '';
  const r = await api('/api/add', {title: t, due});
  if (!r.ok) { alert(r.error || '加不上'); return; }
  $('#title').value = '';
  $('#due').value = '';
  $('#dueTime').value = '';
  $('#title').focus();
  load();
}

$('#addBtn').onclick = add;
$('#title').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
$('#due').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
$('#dueTime').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });

$('#quit').onclick = async () => {
  await api('/quit');
  document.body.innerHTML =
    '<div class="wrap" style="text-align:center;padding-top:80px;color:#8b93a1">' +
    '已经关掉了。<br>这个页面可以直接关，要再用就重新启动一次。</div>';
};

load();
</script>
</body>
</html>
